<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="weather.css" />
  </head>
  <body>
    <div id="box">
      <div id="sidebar">
        <div class="sidebar_container1">
          <div id="logo">
            <span>
              Sky
              <br />
              Sense
            </span>
          </div>
          <div class="sidebar_container1_1">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>🗓</div>
            <div>⚙︎</div>
          </div>
        </div>
        <div class="sidebar_container2">
          <div>➜]</div>
          <div>☀︎</div>
        </div>
      </div>
      <div id="mainContainer">
        <div id="mainContainer_1">
          <input
            type="search"
            name="search"
            id="search"
            placeholder="⌕ Search City....."
          />
          <div class="profile">
            <select class="profile" title="User profile selection">
              <option value="User Name" name="profile">User Name</option>
            </select>
          </div>
        </div>
        <div id="mainContainer_2">
          <div id="mainContainer_2_1">
            <div id="current_weather"></div>
            <div id="weather_prediction"></div>
          </div>
          <div id="mainContainer_2_2">
            
            <div id="highlight">  
              <div id="header3">
                <div>Today Highlight</div>
              </div>
              <div id="item3">
                <div class="today_highlight">
                  <div class="today_highlight_box"></div>
                  <div class="today_highlight_box"></div>
                </div>
                <div class="today_highlight">
                  <div class="today_highlight_box"></div>
                  <div class="today_highlight_box"></div>
                </div>
              </div>

            </div>
            
            <div id="other_cities">
              <div id="header4">
                <div>Other Cities</div>
                <div>Show All</div>
              </div>
              <div id="item4">
                <div class="city">
                  <div class="city_box"></div>
                  <div class="city_box"></div>
                </div>
                <div class="city">
                  <div class="city_box"></div>
                  <div class="city_box"></div>
                </div>
              </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
