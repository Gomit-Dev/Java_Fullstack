<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="weather.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  </head>
  <body>
    <div id="box">
      <div id="sidebar">
        <div class="sidebar_container1">
          <div id="logo">
            <span class="material-symbols-outlined">electric_bolt</span>
            <span>
              Sky
              <br />
              Sense
            </span>
          </div>
          <div class="sidebar_container1_1">
            <div>
              <span class="material-symbols-outlined">bento</span>
            </div>
            <div>
              <span class="material-symbols-outlined">clock_loader_40</span>
            </div>
            <div>
              <span class="material-symbols-outlined">location_on</span>
            </div>
            <div>
              <span class="material-symbols-outlined">calendar_today</span>
            </div>
            <div>
              <span class="material-symbols-outlined">settings</span>
            </div>
          </div>
        </div>
        <div class="sidebar_container2">
          <div>
              <span class="material-symbols-outlined">logout</span>
          </div>
          <div>☀︎</div>
        </div>
      </div>
      <div id="mainContainer">
        <div id="mainContainer_1">
          <input
            type="search"
            name="search"
            id="search"
            placeholder="⌕ Search City....."
          />
          <div class="profile">
            <select class="profile" title="User profile selection">
              <option value="User Name" name="profile">User Name</option>
            </select>
          </div>
        </div>
        <div id="mainContainer_2">
          <div id="mainContainer_2_1">
            <div id="current_weather">
              <div id="header1">
                <div >location</div>
                <div>switch</div>
              </div>
              <div id="item1">
                <div id="current_weather_box_1">location</div>
                <div id="current_weather_box_2">switch</div>
              </div>
            </div>
            <div id="weather_prediction">
              <div id="item2">
                <div id="weather_prediction_box_1">
                  <div id="header2">Today/Week</div>
                  <div id="item_box_2">
                    <div id="item_box_21">2</div>
                    <div id="item_box_22">3</div>
                  </div>
                </div>
                <div id="weather_prediction_box_2">switch</div>
              </div>
            </div>
          </div>
          <div id="mainContainer_2_2">
            
            <div id="highlight">  
              <div id="header3">
                <div>Today Highlight</div>
              </div>
              <div id="item3">
                <div class="today_highlight">
                  <div class="today_highlight_box"></div>
                  <div class="today_highlight_box"></div>
                </div>
                <div class="today_highlight">
                  <div class="today_highlight_box"></div>
                  <div class="today_highlight_box"></div>
                </div>
              </div>

            </div>
            
            <div id="other_cities">
              <div id="header4">
                <div>Other Cities</div>
                <div>Show All</div>
              </div>
              <div id="item4">
                <div class="city">
                  <div class="city_box"></div>
                  <div class="city_box"></div>
                </div>
                <div class="city">
                  <div class="city_box"></div>
                  <div class="city_box"></div>
                </div>
              </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
